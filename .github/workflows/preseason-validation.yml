name: Preseason model validation
on:
  pull_request:
    paths:
      - '*preseason*.py'
      - 'preseason_inputs/**'
      - 'preseason_candidates/**'
      - '.github/workflows/preseason-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas
      - run: python -m unittest test_preseason test_preseason_v2 -v
      - run: python build_preseason_v2.py --season 2027
