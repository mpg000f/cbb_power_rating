name: Daily Ratings Update

on:
  schedule:
    # Run 3x daily: noon, 6 PM, midnight EST
    - cron: '0 17 * * *'
    - cron: '0 23 * * *'
    - cron: '0 5 * * *'
    # Sunday midday, once the week's games are all in: the CFB refresh.
    # Cron is UTC and has no DST, so this is noon ET through 1 Nov and
    # 11 AM ET after the clocks change.
    - cron: '0 16 * * 0'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  update-ratings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CBB repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: cbb_power_rating

      - name: Checkout CFB repository
        id: cfb_checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: mpg000f/cfb_power_rating
          token: ${{ secrets.RATINGS_PAT }}
          path: cfb_power_rating

      - name: Checkout NFL repository
        id: nfl_checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: mpg000f/nfl_power_rating
          token: ${{ secrets.RATINGS_PAT }}
          path: nfl_power_rating

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: cbb_power_rating/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r cbb_power_rating/requirements.txt
          if [ -f cfb_power_rating/requirements.txt ]; then pip install -r cfb_power_rating/requirements.txt; fi
          if [ -f nfl_power_rating/requirements.txt ]; then pip install -r nfl_power_rating/requirements.txt; fi
          pip list | grep -i sports

      - name: Verify imports
        run: |
          python -c "import sportsdataverse.mbb as mbb; print('sportsdataverse.mbb OK')"
          python -c "import pandas; import numpy; print('pandas/numpy OK')"

      # ===== CBB Update =====

      - name: Check CBB data freshness
        id: freshness
        continue-on-error: true
        run: |
          python -c "
          from sportsdataverse.mbb import load_mbb_schedule, load_mbb_team_boxscore
          from datetime import datetime, timedelta
          import pandas as pd

          yesterday = (datetime.utcnow() - timedelta(days=1)).strftime('%Y-%m-%d')
          print(f'Checking for games from {yesterday}')

          sched = load_mbb_schedule([2026])
          sched = sched.to_pandas() if hasattr(sched, 'to_pandas') else pd.DataFrame(sched)
          completed = sched[(sched['home_score'] > 0) | (sched['away_score'] > 0)]
          sched_dates = pd.to_datetime(completed['date']).dt.strftime('%Y-%m-%d')
          yesterday_sched = (sched_dates == yesterday).sum()
          print(f'Schedule: {yesterday_sched} completed games from yesterday')

          box = load_mbb_team_boxscore([2026])
          box = box.to_pandas() if hasattr(box, 'to_pandas') else pd.DataFrame(box)
          box_dates = pd.to_datetime(box['game_date']).dt.strftime('%Y-%m-%d')
          yesterday_box = box[box_dates == yesterday]['game_id'].nunique()
          print(f'Boxscores: {yesterday_box} games from yesterday')

          if yesterday_sched > 0 and yesterday_box == 0:
              print('STALE: yesterday has completed games in schedule but none in boxscores')
              exit(1)
          else:
              print('FRESH: data looks up to date')
          "

      - name: Update CBB ratings
        if: steps.freshness.outcome == 'success'
        working-directory: cbb_power_rating
        run: |
          python update_ratings.py --season 2026

      # ===== CFB Update =====
      # Sunday only. A midweek run would rebuild the current week's snapshot
      # from the two or three games played so far and label it "Week N", when
      # it is really week N-1 plus a Thursday game. Waiting until the slate is
      # complete keeps each snapshot meaning what its name says.
      #
      # Ratings hold at the preseason baseline until teams share opponents
      # (week 2); the blend guard in update_ratings.py enforces that, so these
      # steps are safe to run from the season opener onward.

      - name: Update CFB ratings
        id: cfb_update
        continue-on-error: true
        if: steps.cfb_checkout.outcome == 'success' && (github.event.schedule == '0 16 * * 0' || github.event_name == 'workflow_dispatch')
        working-directory: cfb_power_rating
        env:
          CFB_API_KEY: ${{ secrets.CFB_API_KEY }}
        run: |
          python update_ratings.py --season 2026
          python generate_weekly.py --season 2026

      - name: Commit and push CFB ratings
        if: steps.cfb_update.outcome == 'success'
        continue-on-error: true
        working-directory: cfb_power_rating
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add historical_ratings/
          git diff --quiet --cached historical_ratings/ || git commit -m "Update CFB ratings $(date +'%Y-%m-%d')"
          git push

      # ===== NFL Update =====
      # No-ops until in-season play-by-play data exists for the target season;
      # early-season runs blend with the preseason baseline in the NFL repo.

      - name: Update NFL ratings
        id: nfl_update
        continue-on-error: true
        if: steps.nfl_checkout.outcome == 'success'
        working-directory: nfl_power_rating
        run: |
          python update_ratings.py --season 2026

      - name: Commit and push NFL ratings
        if: steps.nfl_update.outcome == 'success'
        continue-on-error: true
        working-directory: nfl_power_rating
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add historical_ratings/
          git diff --quiet --cached historical_ratings/ || git commit -m "Update NFL ratings $(date +'%Y-%m-%d')"
          git push

      # ===== Build & Deploy =====

      - name: Build static site
        working-directory: cbb_power_rating
        run: |
          python build_static.py

      - name: Check for changes
        id: changes
        working-directory: cbb_power_rating
        run: |
          git diff --quiet historical_ratings/ docs/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated ratings
        if: steps.changes.outputs.changed == 'true'
        working-directory: cbb_power_rating
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add historical_ratings/ docs/data/ratings_*.json docs/data/seasons.json docs/data/cfb/ docs/data/nfl/ docs/index.html
          git commit -m "Update ratings $(date +'%Y-%m-%d')"
          git push
